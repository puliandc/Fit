openapi: 3.0.3
info:
  title: Fit 训练循环 API 规格
  description: Fit应用训练循环功能的API接口定义
  version: 1.0.0
  contact:
    name: Fit开发团队
    email: dev@fitapp.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: https://api.fitapp.com/v1
    description: 生产环境
  - url: https://staging-api.fitapp.com/v1
    description: 测试环境

paths:
  /workouts:
    get:
      tags:
        - Workouts
      summary: 获取训练记录列表
      description: 获取用户的训练记录，支持分页和筛选
      parameters:
        - name: limit
          in: query
          description: 返回记录数量限制
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          description: 分页偏移量
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: start_date
          in: query
          description: 开始日期 (ISO 8601格式)
          required: false
          schema:
            type: string
            format: date
        - name: end_date
          in: query
          description: 结束日期 (ISO 8601格式)
          required: false
          schema:
            type: string
            format: date
        - name: status
          in: query
          description: 训练状态筛选
          required: false
          schema:
            $ref: '#/components/schemas/WorkoutStatus'
      responses:
        '200':
          description: 成功返回训练记录列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Workout'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags:
        - Workouts
      summary: 创建新训练
      description: 开始一个新的训练记录
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - exercises
              properties:
                exercises:
                  type: array
                  description: 训练动作列表
                  items:
                    $ref: '#/components/schemas/Exercise'
                scheduled_duration:
                  type: integer
                  description: 预期训练时长（秒）
                  minimum: 600
                  maximum: 14400
                notes:
                  type: string
                  description: 训练备注
                  maxLength: 200
              example:
                exercises:
                  - id: "123e4567-e89b-12d3-a456-426614174000"
                    name: "深蹲"
                    category: "strength"
                scheduled_duration: 3600
                notes: "腿部训练日"
      responses:
        '201':
          description: 训练创建成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Workout'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /workouts/{workoutId}:
    get:
      tags:
        - Workouts
      summary: 获取单个训练详情
      description: 根据ID获取特定训练的详细信息
      parameters:
        - name: workoutId
          in: path
          required: true
          description: 训练ID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 成功返回训练详情
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Workout'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

    put:
      tags:
        - Workouts
      summary: 更新训练信息
      description: 更新训练的基本信息（未完成的训练）
      parameters:
        - name: workoutId
          in: path
          required: true
          description: 训练ID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                notes:
                  type: string
                  description: 训练备注
                  maxLength: 200
                scheduled_duration:
                  type: integer
                  description: 预期训练时长（秒）
                  minimum: 600
                  maximum: 14400
              example:
                notes: "更新后的训练备注"
                scheduled_duration: 4200
      responses:
        '200':
          description: 训练更新成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Workout'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags:
        - Workouts
      summary: 删除训练记录
      description: 删除指定的训练记录（仅限未完成的训练）
      parameters:
        - name: workoutId
          in: path
          required: true
          description: 训练ID
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: 训练删除成功
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /workouts/{workoutId}/sets:
    get:
      tags:
        - WorkoutSets
      summary: 获取训练组数列表
      description: 获取指定训练的所有组数记录
      parameters:
        - name: workoutId
          in: path
          required: true
          description: 训练ID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 成功返回训练组数列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/WorkoutSet'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags:
        - WorkoutSets
      summary: 添加训练组数
      description: 向指定训练添加新的组数记录
      parameters:
        - name: workoutId
          in: path
          required: true
          description: 训练ID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - weight
                - reps
              properties:
                weight:
                  type: number
                  format: double
                  description: 重量（公斤）
                  minimum: 0
                  maximum: 1000
                  example: 52.5
                reps:
                  type: integer
                  description: 重复次数
                  minimum: 1
                  maximum: 1000
                  example: 8
                rest_time:
                  type: integer
                  description: 休息时间（秒）
                  minimum: 0
                  maximum: 1800
                  example: 90
                rpe:
                  type: integer
                  description: 主观疲劳度（1-10）
                  minimum: 1
                  maximum: 10
                  example: 7
                notes:
                  type: string
                  description: 组数备注
                  maxLength: 100
                  example: "感觉不错"
                is_warmup:
                  type: boolean
                  description: 是否为热身组
                  default: false
              example:
                weight: 52.5
                reps: 8
                rest_time: 90
                rpe: 7
                notes: "感觉不错"
                is_warmup: false
      responses:
        '201':
          description: 训练组数添加成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/WorkoutSet'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /workouts/{workoutId}/sets/{setId}:
    put:
      tags:
        - WorkoutSets
      summary: 更新训练组数
      description: 更新指定训练组数的信息
      parameters:
        - name: workoutId
          in: path
          required: true
          description: 训练ID
          schema:
            type: string
            format: uuid
        - name: setId
          in: path
          required: true
          description: 组数ID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                weight:
                  type: number
                  format: double
                  description: 重量（公斤）
                  minimum: 0
                  maximum: 1000
                  example: 55.0
                reps:
                  type: integer
                  description: 重复次数
                  minimum: 1
                  maximum: 1000
                  example: 6
                rest_time:
                  type: integer
                  description: 休息时间（秒）
                  minimum: 0
                  maximum: 1800
                  example: 120
                rpe:
                  type: integer
                  description: 主观疲劳度（1-10）
                  minimum: 1
                  maximum: 10
                  example: 8
                notes:
                  type: string
                  description: 组数备注
                  maxLength: 100
                  example: "更新后的备注"
              example:
                weight: 55.0
                reps: 6
                rest_time: 120
                rpe: 8
                notes: "更新后的备注"
      responses:
        '200':
          description: 训练组数更新成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/WorkoutSet'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags:
        - WorkoutSets
      summary: 删除训练组数
      description: 删除指定的训练组数
      parameters:
        - name: workoutId
          in: path
          required: true
          description: 训练ID
          schema:
            type: string
            format: uuid
        - name: setId
          in: path
          required: true
          description: 组数ID
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: 训练组数删除成功
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /workouts/{workoutId}/complete:
    post:
      tags:
        - Workouts
      summary: 完成训练
      description: 标记训练为已完成状态
      parameters:
        - name: workoutId
          in: path
          required: true
          description: 训练ID
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                notes:
                  type: string
                  description: 完成训练时的备注
                  maxLength: 200
                  example: "训练完成，感觉很好！"
      responses:
        '200':
          description: 训练完成成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Workout'
                  summary:
                    $ref: '#/components/schemas/WorkoutSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /exercises:
    get:
      tags:
        - Exercises
      summary: 获取动作列表
      description: 获取所有可用的训练动作，支持筛选
      parameters:
        - name: category
          in: query
          description: 动作类别筛选
          schema:
            $ref: '#/components/schemas/ExerciseCategory'
        - name: muscle_groups
          in: query
          description: 目标肌群筛选（逗号分隔）
          schema:
            type: string
            example: "quadriceps,glutes,hamstrings"
        - name: difficulty
          in: query
          description: 难度等级筛选
          schema:
            type: integer
            minimum: 1
            maximum: 5
      responses:
        '200':
          description: 成功返回动作列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Exercise'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  schemas:
    Workout:
      type: object
      required:
        - id
        - date
        - created_at
        - updated_at
        - sets
        - duration
        - status
      properties:
        id:
          type: string
          format: uuid
          description: 训练唯一标识符
          example: "123e4567-e89b-12d3-a456-426614174000"
        date:
          type: string
          format: date
          description: 训练日期
          example: "2025-10-12"
        created_at:
          type: string
          format: date-time
          description: 创建时间
          example: "2025-10-12T14:30:00Z"
        updated_at:
          type: string
          format: date-time
          description: 更新时间
          example: "2025-10-12T15:45:00Z"
        start_time:
          type: string
          format: date-time
          description: 开始时间
          example: "2025-10-12T14:30:00Z"
        end_time:
          type: string
          format: date-time
          description: 结束时间
          nullable: true
          example: "2025-10-12T15:45:00Z"
        sets:
          type: array
          description: 训练组数列表
          items:
            $ref: '#/components/schemas/WorkoutSet'
        duration:
          type: integer
          description: 训练时长（秒）
          example: 4500
        notes:
          type: string
          description: 训练备注
          maxLength: 200
          nullable: true
          example: "腿部训练日，状态不错"
        tags:
          type: array
          description: 标签列表
          items:
            type: string
          example: ["腿部", "力量"]
        status:
          $ref: '#/components/schemas/WorkoutStatus'
        exercises:
          type: array
          description: 训练动作列表
          items:
            $ref: '#/components/schemas/Exercise'

    WorkoutSet:
      type: object
      required:
        - id
        - workout_id
        - timestamp
        - weight
        - reps
      properties:
        id:
          type: string
          format: uuid
          description: 组数唯一标识符
          example: "123e4567-e89b-12d3-a456-426614174001"
        workout_id:
          type: string
          format: uuid
          description: 所属训练ID
          example: "123e4567-e89b-12d3-a456-426614174000"
        timestamp:
          type: string
          format: date-time
          description: 完成时间
          example: "2025-10-12T14:45:00Z"
        weight:
          type: number
          format: double
          description: 重量（公斤）
          minimum: 0
          maximum: 1000
          example: 52.5
        reps:
          type: integer
          description: 重复次数
          minimum: 1
          maximum: 1000
          example: 8
        rest_time:
          type: integer
          description: 休息时间（秒）
          minimum: 0
          maximum: 1800
          nullable: true
          example: 90
        rpe:
          type: integer
          description: 主观疲劳度（1-10）
          minimum: 1
          maximum: 10
          nullable: true
          example: 7
        notes:
          type: string
          description: 组数备注
          maxLength: 100
          nullable: true
          example: "最后一组，状态很好"
        is_warmup:
          type: boolean
          description: 是否为热身组
          default: false
          example: false

    Exercise:
      type: object
      required:
        - id
        - name
        - category
      properties:
        id:
          type: string
          format: uuid
          description: 动作唯一标识符
          example: "123e4567-e89b-12d3-a456-426614174100"
        name:
          type: string
          description: 动作名称
          minLength: 2
          maxLength: 50
          example: "深蹲"
        category:
          $ref: '#/components/schemas/ExerciseCategory'
        description:
          type: string
          description: 动作描述
          maxLength: 500
          nullable: true
          example: "基础腿部训练动作，主要锻炼股四头肌"
        instructions:
          type: array
          description: 执行说明
          items:
            type: string
          example: ["双脚与肩同宽", "臀部后坐，膝盖弯曲", "保持背部挺直"]
        difficulty:
          type: integer
          description: 难度等级（1-5）
          minimum: 1
          maximum: 5
          example: 2
        muscle_groups:
          type: array
          description: 目标肌群
          items:
            type: string
          example: ["quadriceps", "glutes", "hamstrings"]
        equipment:
          type: array
          description: 所需设备
          items:
            type: string
          example: ["杠铃", "深蹲架"]
        image_url:
          type: string
          format: uri
          description: 示例图片URL
          nullable: true
          example: "https://example.com/images/squat.jpg"
        video_url:
          type: string
          format: uri
          description: 示例视频URL
          nullable: true
          example: "https://example.com/videos/squat.mp4"

    WorkoutStatus:
      type: string
      enum:
        - not_started
        - in_progress
        - paused
        - completed
        - abandoned
      description: 训练状态

    ExerciseCategory:
      type: string
      enum:
        - strength
        - cardio
        - flexibility
        - balance
        - functional
        - sports
        - rehabilitation
      description: 动作类别

    WorkoutSummary:
      type: object
      required:
        - total_sets
        - total_volume
        - average_weight
        - duration
      properties:
        total_sets:
          type: integer
          description: 总组数
          example: 15
        total_volume:
          type: number
          format: double
          description: 总容量（重量×次数）
          example: 1250.5
        average_weight:
          type: number
          format: double
          description: 平均重量
          example: 52.5
        average_reps:
          type: number
          format: double
          description: 平均次数
          example: 8.2
        duration:
          type: integer
          description: 训练时长（秒）
          example: 4500
        best_set:
          $ref: '#/components/schemas/WorkoutSet'
          description: 最佳组数
        personal_records:
          type: array
          description: 个人记录
          items:
            type: object
            properties:
              exercise:
                type: string
                description: 动作名称
                example: "深蹲"
              type:
                type: string
                enum: [weight, reps, volume]
                description: 记录类型
                example: "weight"
              value:
                type: number
                description: 记录值
                example: 55.0
              previous_best:
                type: number
                description: 之前最佳
                example: 52.5

    Pagination:
      type: object
      required:
        - limit
        - offset
        - total
        - has_more
      properties:
        limit:
          type: integer
          description: 页面大小
          example: 20
        offset:
          type: integer
          description: 偏移量
          example: 0
        total:
          type: integer
          description: 总记录数
          example: 156
        has_more:
          type: boolean
          description: 是否有更多数据
          example: true

    APIError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: 错误代码
          example: "VALIDATION_FAILED"
        message:
          type: string
          description: 错误消息
          example: "输入数据验证失败"
        details:
          type: object
          description: 错误详情
          properties:
            field:
              type: string
              description: 错误字段
              example: "weight"
            reason:
              type: string
              description: 错误原因
              example: "重量必须为正数"

  responses:
    BadRequest:
      description: 请求参数错误
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              errors:
                type: array
                items:
                  $ref: '#/components/schemas/APIError'
              message:
                type: string
                example: "请求参数错误"

    Unauthorized:
      description: 未授权访问
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              error:
                $ref: '#/components/schemas/APIError'
              message:
                type: string
                example: "未授权访问"

    NotFound:
      description: 资源未找到
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              error:
                $ref: '#/components/schemas/APIError'
              message:
                type: string
                example: "资源未找到"

    InternalServerError:
      description: 服务器内部错误
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              error:
                $ref: '#/components/schemas/APIError'
              message:
                type: string
                example: "服务器内部错误"

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

security:
  - BearerAuth: []

tags:
  - name: Workouts
    description: 训练记录管理
  - name: WorkoutSets
    description: 训练组数管理
  - name: Exercises
    description: 训练动作管理