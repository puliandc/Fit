# Development Docker Compose configuration
# Ensures consistent development environment across machines

version: '3.8'

services:
  dev-server:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
      - "3001:3001"  # Alternative port
    environment:
      - NODE_ENV=development
      - AUTO_CLEANUP=true
      - AUTO_OPEN=false
      - PORT=3000
    volumes:
      - .:/app
      - /app/node_modules
      - vite_cache:/app/node_modules/.vite
    networks:
      - dev-network
    stdin_open: true
    tty: true
    command: >
      sh -c "
        echo '🚀 Starting development server in Docker...' &&
        ./scripts/dev-cleanup.sh status &&
        npm run dev
      "
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

volumes:
  vite_cache:
    driver: local

networks:
  dev-network:
    driver: bridge