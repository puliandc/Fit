name: Fit App CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  PROJECT: Fit.xcodeproj
  SCHEME: Fit
  DERIVED_DATA_PATH: DerivedData

jobs:
  build-and-test:
    name: Build and Test
    runs-on: macos-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Show Xcode Version
      run: xcodebuild -version

    - name: Show Available Simulators
      run: xcrun simctl list devices available

    - name: Cache Derived Data
      uses: actions/cache@v3
      with:
        path: ${{ env.DERIVED_DATA_PATH }}
        key: ${{ runner.os }}-derived-data-${{ hashFiles('**/*.swift') }}
        restore-keys: |
          ${{ runner.os }}-derived-data-

    - name: Pre-build Validation
      run: |
        chmod +x scripts/pre-build-check.sh
        ./scripts/pre-build-check.sh

    - name: Build for Debug (iPhone 16e)
      run: |
        chmod +x scripts/build.sh
        ./scripts/build.sh Debug 'platform=iOS Simulator,name=iPhone 16e'

    - name: Build for Release (iPhone 16e)
      run: |
        ./scripts/build.sh Release 'platform=iOS Simulator,name=iPhone 16e'

    - name: Run Tests (if available)
      run: |
        if xcodebuild -list -project "$PROJECT" | grep -q "Test"; then
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination 'platform=iOS Simulator,name=iPhone 16e' \
            -enableCodeCoverage YES \
            -derivedDataPath "$DERIVED_DATA_PATH" || echo "Tests not configured yet"
        else
          echo "No test targets configured"
        fi

    - name: Build on Physical Device Configuration
      run: |
        xcodebuild build \
          -project "$PROJECT" \
          -scheme "$SCHEME" \
          -destination 'generic/platform=iOS' \
          -configuration Debug \
          -derivedDataPath "$DERIVED_DATA_PATH" \
          CODE_SIGNING_ALLOWED=NO

    - name: Analyze Build Performance
      run: |
        echo "📊 Build Performance Analysis"

        # Find and analyze build logs
        BUILD_LOGS=$(find logs -name "build-*.log" 2>/dev/null || echo "")

        if [[ -n "$BUILD_LOGS" ]]; then
          for log in $BUILD_LOGS; do
            echo "Analyzing $log:"

            # Count compiled files
            COMPILED=$(grep -c "Compiling" "$log" || echo "0")
            echo "  Compiled files: $COMPILED"

            # Count warnings
            WARNINGS=$(grep -c "warning:" "$log" || echo "0")
            echo "  Warnings: $WARNINGS"

            # Extract build time if available
            if grep -q "Build succeeded" "$log"; then
              echo "  Status: Success ✅"
            fi
          done
        fi

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: build-artifacts
        path: |
          DerivedData/Build/Products/
          logs/
        retention-days: 7

    - name: Upload Error Analysis
      uses: actions/upload-artifact@v3
      if: failure()
      with:
        name: error-analysis
        path: |
          logs/error-*
        retention-days: 14

  security-scan:
    name: Security Scan
    runs-on: macos-latest
    if: github.event_name == 'pull_request'

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Run Security Scan
      run: |
        echo "🔒 Running security analysis..."

        # Check for hardcoded secrets
        echo "Checking for hardcoded secrets..."
        if grep -r -i -E "(password|secret|key|token)\s*=\s*['\"][^'\"]{8,}" Fit/ --exclude-dir=DerivedData; then
          echo "⚠️ Potential hardcoded secrets found"
        else
          echo "✅ No hardcoded secrets detected"
        fi

        # Check for insecure network configurations
        echo "Checking for insecure network configurations..."
        if grep -r "http://" Fit/ --exclude-dir=DerivedData --include="*.swift"; then
          echo "⚠️ Non-HTTPS URLs found"
        else
          echo "✅ No insecure URLs detected"
        fi

        # Check for debug code in production
        echo "Checking for debug code..."
        if grep -r "print\|NSLog\|debugPrint" Fit/ --include="*.swift"; then
          echo "ℹ️ Debug print statements found (consider removing for production)"
        fi

  performance-test:
    name: Performance Test
    runs-on: macos-latest
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Performance Build Test
      run: |
        echo "⚡ Running performance build test..."

        # Clean build test
        START_TIME=$(date +%s)
        xcodebuild clean build \
          -project "$PROJECT" \
          -scheme "$SCHEME" \
          -destination 'platform=iOS Simulator,name=iPhone 16e' \
          -configuration Release \
          -derivedDataPath "$DERIVED_DATA_PATH"
        END_TIME=$(date +%s)

        BUILD_TIME=$((END_TIME - START_TIME))
        echo "Clean build time: ${BUILD_TIME}s"

        # Check app size
        APP_PATH=$(find "$DERIVED_DATA_PATH" -name "Fit.app" -type d | head -1)
        if [[ -n "$APP_PATH" ]]; then
          APP_SIZE=$(du -sh "$APP_PATH" | awk '{print $1}')
          echo "App size: $APP_SIZE"

          # Performance thresholds
          if [[ $BUILD_TIME -gt 300 ]]; then
            echo "⚠️ Build time exceeds 5 minutes"
          fi
        fi

  deploy-simulator:
    name: Deploy to Simulator
    runs-on: macos-latest
    if: github.ref == 'refs/heads/develop'

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Build and Install to Simulator
      run: |
        echo "📱 Building and installing to simulator..."

        # Build the app
        xcodebuild build \
          -project "$PROJECT" \
          -scheme "$SCHEME" \
          -destination 'platform=iOS Simulator,name=iPhone 16e' \
          -configuration Debug \
          -derivedDataPath "$DERIVED_DATA_PATH"

        # Find built app
        APP_PATH=$(find "$DERIVED_DATA_PATH" -name "Fit.app" -type d | head -1)

        if [[ -n "$APP_PATH" ]]; then
          echo "Installing app to simulator..."
          xcrun simctl install booted "$APP_PATH"
          echo "✅ App installed successfully"

          # Optionally launch the app
          # xcrun simctl launch booted Jason.Fit
        else
          echo "❌ App not found in build output"
          exit 1
        fi